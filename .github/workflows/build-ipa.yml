name: Build dsh-ios unsigned IPA

# Manual-only workflow. Builds everettjf/dsh-ios on a macOS arm64 runner and
# uploads an unsigned IPA as an artifact.
on:
  workflow_dispatch:
    inputs:
      bundle_prefix:
        description: "Bundle ID prefix, e.g. com.xnuapp"
        required: false
        default: "com.xnuapp"
      build_rootfs:
        description: "Build the guest Linux rootfs (true/false)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 150

    steps:
      - name: Environment check
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          ruby -v

      - name: Clone upstream dsh-ios
        run: |
          git clone --depth 1 https://github.com/everettjf/dsh-ios.git repo
          cd repo
          git log -1 --format='%H %s'

      - name: Install build tooling
        run: |
          brew install meson ninja lld
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/opt/lld/bin:$PATH"
          ld.lld --version
          meson --version
          ninja --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Strip entitlements for personal signing
        working-directory: repo
        run: |
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict/></plist>\n' > app/DSH.entitlements
          cat app/DSH.entitlements

      - name: Set bundle prefix
        working-directory: repo
        run: |
          PREFIX="${{ inputs.bundle_prefix }}"
          if [ -z "$PREFIX" ]; then PREFIX="com.xnuapp"; fi
          sed -i '' "s/^DSH_BUNDLE_ID_PREFIX = .*/DSH_BUNDLE_ID_PREFIX = ${PREFIX}/" app/AppDSH.xcconfig
          grep -n "DSH_BUNDLE_ID_PREFIX" app/AppDSH.xcconfig

      - name: Build emulator (ish-arm64)
        working-directory: repo
        run: make emulator

      - name: Build guest rootfs
        if: ${{ inputs.build_rootfs != 'false' }}
        working-directory: repo
        timeout-minutes: 100
        run: make rootfs

      - name: Generate Xcode project
        working-directory: repo
        run: make project

      - name: Build DSH.app unsigned
        working-directory: repo
        run: |
          rm -rf build/dd
          xcodebuild -project DSH.xcodeproj \
            -scheme DSH \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DSH_DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        working-directory: repo
        run: |
          APP="$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name 'DSH.app' | head -1)"
          echo "APP=$APP"
          if [ ! -d "$APP" ]; then
            echo "DSH.app not found"
            find build/dd/Build/Products -maxdepth 2 -type d
            exit 1
          fi
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry DSH-unsigned.ipa Payload
          ls -lh DSH-unsigned.ipa
          shasum -a 256 DSH-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: repo/out/DSH-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
